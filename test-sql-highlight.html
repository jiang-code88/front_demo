<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Editor 测试页 — CodeMirror 6</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      margin: 0;
    }
    .nav {
      background: #2563eb;
      color: #fff;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-logo {
      width: 32px; height: 32px;
      background: rgba(255,255,255,.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700;
    }
    .nav h1 { font-size: 17px; font-weight: 700; margin: 0; }
    .nav p  { font-size: 12px; opacity: .75; margin: 2px 0 0; }
    .container { max-width: 1000px; margin: 0 auto; padding: 28px 20px; }
    .hint-banner {
      background: #dbeafe;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #1e40af;
      line-height: 1.6;
    }
    .hint-banner strong { font-weight: 700; }
    .debug-panel {
      margin-top: 28px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
    }
    .debug-panel h3 {
      font-size: 14px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 0 0 12px;
    }
    .debug-row {
      display: flex;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 13px;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    .debug-row:last-child { border-bottom: none; }
    .debug-label {
      min-width: 120px;
      color: #6b7280;
      font-weight: 600;
    }
    .debug-value {
      color: #111827;
      word-break: break-all;
      flex: 1;
    }
    .debug-value.empty { color: #9ca3af; font-style: italic; }
    .sample-btn {
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="nav">
    <div class="nav-logo">SQL</div>
    <div>
      <h1>SQL Tools — 测试页</h1>
      <p>CodeMirror 6 语法高亮油猴脚本验证</p>
    </div>
  </div>

  <div class="container">
    <div class="hint-banner">
      <strong>使用说明：</strong>
      安装 Tampermonkey 脚本 <code>tampermonkey-sql-highlight.user.js</code> 后，
      本页面会自动加载 CodeMirror 6 SQL 编辑器。测试项：语法高亮、自动补全、多 Tab、选区同步、表单提交。
    </div>

    <!-- 模拟目标页面表单结构 -->
    <form id="sqlForm" action="#" method="post" onsubmit="return handleFormSubmit(event)">
      <div class="row" style="border-bottom: 1px dashed lightblue;padding-bottom: 10px;">
        <div class="col-md-10">
          <textarea
            style="height:250px;resize: vertical;overflow: auto;"
            onselect="sqlQPost()"
            class="form-control sqlautocomplete"
            id="sql"
            name="sql"
            placeholder='请写sql语句,只支持select,show,describe(desc),默认limit 100, 多条sql语句请用英文分号 ";" 分割，不选中或选中多条提交，默认只执行第一条'></textarea>
        </div>
        <div class="col-md-2 pull-left">
          <div class="btn-group">
            <button style='height:45px' class="btn btn-sm btn-default" id="check_submit" type="button" onclick="handleSubmit()">提交</button>
            <button style='height:45px' class="btn btn-sm btn-default" formaction="sqltools_excel" id="check_submit_export" type="submit">导出</button>
          </div>
        </div>
        <input type="hidden" id="select_sql" name="select_sql">
        <input type="hidden" id="current_erp" name="current_erp" value="">
      </div>
    </form>

    <button class="btn btn-info btn-sm sample-btn" onclick="loadSampleSQL()">载入示例 SQL</button>

    <!-- 调试面板 -->
    <div class="debug-panel">
      <h3>调试信息</h3>
      <div class="debug-row">
        <span class="debug-label">#sql value</span>
        <span class="debug-value empty" id="dbg-sql">(空)</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">#select_sql</span>
        <span class="debug-value empty" id="dbg-select-sql">(空)</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">选区范围</span>
        <span class="debug-value empty" id="dbg-sel-range">无选区</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">提交事件</span>
        <span class="debug-value empty" id="dbg-submit">未提交</span>
      </div>
    </div>
  </div>

  <script>
    /**
     * 模拟目标页面的 sqlQPost 函数
     * 读取 textarea#sql 的选区，写入 #select_sql 隐藏域
     */
    function sqlQPost() {
      var sqlInput = document.getElementById('sql');
      var selectSql = document.getElementById('select_sql');
      if (!sqlInput || !selectSql) return;

      var start = sqlInput.selectionStart || 0;
      var end = sqlInput.selectionEnd || 0;

      if (start !== end) {
        selectSql.value = sqlInput.value.substring(start, end);
      } else {
        selectSql.value = '';
      }
      updateDebug();
    }

    /**
     * 提交按钮处理
     */
    function handleSubmit() {
      var form = document.getElementById('sqlForm');
      var sqlInput = document.getElementById('sql');
      var selectSql = document.getElementById('select_sql');

      var dbg = document.getElementById('dbg-submit');
      var submitType = selectSql.value ? '选中SQL' : '完整SQL';
      dbg.textContent = '提交 (' + submitType + ') — sql 长度=' + sqlInput.value.length + ', select_sql 长度=' + selectSql.value.length;
      dbg.classList.remove('empty');

      console.log('[SQL Tools] 提交', {
        sql: sqlInput.value,
        select_sql: selectSql.value,
        current_erp: document.getElementById('current_erp').value
      });
    }

    /**
     * 表单提交处理（导出按钮触发）
     */
    function handleFormSubmit(e) {
      e.preventDefault();
      var dbg = document.getElementById('dbg-submit');
      dbg.textContent = '表单提交 (导出) — action=' + (e.submitter ? e.submitter.getAttribute('formaction') : 'default');
      dbg.classList.remove('empty');
      console.log('[SQL Tools] 表单提交', {
        sql: document.getElementById('sql').value,
        select_sql: document.getElementById('select_sql').value
      });
      return false;
    }

    /**
     * 更新调试面板
     */
    function updateDebug() {
      var sqlInput = document.getElementById('sql');
      var selectSql = document.getElementById('select_sql');

      var dbgSql = document.getElementById('dbg-sql');
      var dbgSelSql = document.getElementById('dbg-select-sql');
      var dbgSelRange = document.getElementById('dbg-sel-range');

      var sqlVal = sqlInput ? sqlInput.value : '';
      var selVal = selectSql ? selectSql.value : '';

      dbgSql.textContent = sqlVal ? (sqlVal.length > 80 ? sqlVal.substring(0, 80) + '... (' + sqlVal.length + ' chars)' : sqlVal) : '(空)';
      dbgSql.classList.toggle('empty', !sqlVal);

      dbgSelSql.textContent = selVal ? (selVal.length > 80 ? selVal.substring(0, 80) + '... (' + selVal.length + ' chars)' : selVal) : '(空)';
      dbgSelSql.classList.toggle('empty', !selVal);

      if (sqlInput) {
        var start = sqlInput.selectionStart || 0;
        var end = sqlInput.selectionEnd || 0;
        if (start !== end) {
          dbgSelRange.textContent = '[' + start + ', ' + end + ') — ' + (end - start) + ' chars';
          dbgSelRange.classList.remove('empty');
        } else {
          dbgSelRange.textContent = '无选区';
          dbgSelRange.classList.add('empty');
        }
      }
    }

    /**
     * 载入示例 SQL
     */
    function loadSampleSQL() {
      var sqlInput = document.getElementById('sql');
      sqlInput.value = [
        '-- 查询用户表',
        'SELECT id, name, email, created_at',
        'FROM users',
        'WHERE status = "active"',
        '  AND created_at >= "2024-01-01"',
        'ORDER BY created_at DESC',
        'LIMIT 100;',
        '',
        '-- 查询订单统计',
        'SELECT u.name, COUNT(o.id) AS order_count, SUM(o.total) AS total_amount',
        'FROM users u',
        'LEFT JOIN orders o ON u.id = o.user_id',
        'GROUP BY u.id, u.name',
        'HAVING order_count > 0;',
        '',
        'SHOW TABLES;',
        'DESCRIBE users;'
      ].join('\n');
      updateDebug();
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      updateDebug();
    });
  </script>
</body>
</html>
